<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%23d9480f%22/%3E%3Cpath fill=%22%23fff%22 d=%22M5 5h5v5H5zm9 0h5v5h-5zM5 14h5v5H5zm9 0h2v2h-2zm3 3h2v2h-2zm-3 0h2v2h-2z%22/%3E%3C/svg%3E">
<title>Create account — MenuQR</title></head><body>
<nav class="nav"><div class="container"><a class="logo" href="/"><span class="logo-mark"></span>MenuQR</a><div class="nav-links"></div></div></nav>
<main class="auth-wrap"><form class="auth-card" id="form" novalidate>
  <h1>Create your QR menu</h1><p class="sub">Free forever for one restaurant. No credit card.</p>
  <div class="error hidden" id="err"></div>
  <div class="field"><label for="restaurantName">Restaurant name</label><input id="restaurantName" name="restaurantName" type="text" required maxlength="80" placeholder="e.g. Lagoon Seafood Grill" autocomplete="organization"></div>
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="you@restaurant.com"></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div>
  <button class="btn btn-primary btn-lg" type="submit">Create account</button>
  <p class="auth-alt">Already have an account? <a href="/login">Log in</a></p>
</form></main>
<script src="/js/common.js"></script>
<script>
api('/api/me').then(() => location.replace('/dashboard')).catch(() => {});
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button'), err = document.getElementById('err');
  err.classList.add('hidden'); btn.disabled = true;
  try {
    await api('/api/register', { method: 'POST', body: Object.fromEntries(new FormData(f)) });
    location.href = '/dashboard';
  } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); btn.disabled = false; }
});
</script>
</body></html>
